<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#10101c"><title>어둠의 계승자</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0e17;color:#e8dfce;font:14px system-ui,sans-serif}header{background:#191829;padding:13px;border-bottom:1px solid #665437;position:sticky;top:0;z-index:3}h1{font-size:20px;color:#e9c985;margin:0}small,.muted{color:#a6a0a4}.wrap{max-width:850px;margin:auto;padding:12px}.panel{background:#1a1b2b;border:1px solid #3e3a4c;border-radius:10px;padding:13px;margin-bottom:12px}h2{font-size:16px;color:#e8c17d;margin:0 0 9px}button,select,input{background:#292b42;color:#f4e9d7;border:1px solid #655675;border-radius:7px;padding:10px;font:inherit}button{cursor:pointer}button:disabled{opacity:.35}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.actions button{text-align:left}.tabs{display:flex;overflow:auto;gap:6px;margin-bottom:12px}.tabs button{white-space:nowrap;padding:9px}.tabs .active{background:#69503a}.bar{height:11px;background:#383647;border-radius:9px;overflow:hidden;margin:5px 0 10px}.bar span{display:block;height:100%;background:#b64e5b}.bar.mp span{background:#587ac5}.bar.xp span{background:#c3a457}.log{height:240px;overflow:auto;background:#0c0e18;border:1px solid #343442;padding:10px;border-radius:8px;line-height:1.8}.log div{border-bottom:1px solid #222432}.good{color:#89d7a4}.bad{color:#ee8e8e}.gold{color:#eac47b}.flex{display:flex;justify-content:space-between;gap:8px;align-items:center}.chip{display:inline-block;padding:4px 7px;background:#313249;border-radius:6px;margin:3px}.monster{border:1px solid #5c4250;padding:10px;border-radius:9px;background:#26202d;margin:8px 0}.item{padding:9px;border-bottom:1px solid #363648}.item button{padding:5px 9px;margin-left:5px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.map button{padding:8px 2px;min-height:53px;font-size:11px}.map .here{background:#69543d;border-color:#d3ad6c}#start{position:fixed;inset:0;background:#0b0c15;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}#start .panel{width:min(100%,440px);padding:24px}#start input,#start select{width:100%;margin:6px 0 13px}#start button{width:100%;background:#69503a}footer{color:#777;text-align:center;padding:25px} @media(min-width:700px){.columns{display:grid;grid-template-columns:270px 1fr;gap:12px}.actions{grid-template-columns:repeat(3,1fr)}} .pixelViewport{overflow:auto;border:2px solid #5d526f;border-radius:8px;background:#10111a}.pixelViewport canvas{width:100%;max-width:504px;height:auto;display:block;margin:auto;image-rendering:pixelated}.visualControls{text-align:center;margin:12px}.visualControls button{font-size:22px;min-width:60px;min-height:48px;margin:3px;touch-action:manipulation}.v10arena{max-width:420px;margin:10px auto;background:#121321;border:2px solid #655779;border-radius:8px;overflow:hidden;text-align:center}.v10arena canvas{display:block;width:100%;max-width:288px;height:auto;margin:auto;image-rendering:pixelated}.v21-stage{max-width:420px;margin:8px auto;background:#121321;border:2px solid #655779;border-radius:8px}.v21-stage canvas{display:block;width:100%;image-rendering:pixelated}</style></head><body><div id="start"><div class="panel"><h1>⚔ 어둠의 계승자</h1><p>잊혀진 왕국의 마지막 모험가가 되십시오.</p><label>모험가 이름</label><input id="name" maxlength="14" placeholder="이름을 입력하세요"><label>직업</label><select id="job"><option value="전사">전사 — 높은 체력과 방어력</option><option value="도적">도적 — 높은 치명타와 회피</option><option value="마법사">마법사 — 강력한 마법 피해</option><option value="성직자">성직자 — 회복과 안정적인 전투</option><option value="무도가">무도가 — 연타와 기력 운용</option></select><p class="muted">모든 직업은 공격, 기술, 성장 방식이 다릅니다. 진행 내용은 이 기기에 자동 저장됩니다.</p><button type="button" id="beginAdventure" onclick="startGame()">모험 시작</button><p><button onclick="loadGame()">저장된 모험 불러오기</button></p></div></div><header><div class="flex"><div><h1>☽ 어둠의 계승자</h1><small>잊혀진 왕국 · 싱글 MUD RPG</small></div><button onclick="saveGame();alert('저장했습니다')">💾 저장</button></div></header><div class="wrap"><div class="columns"><div><section class="panel" id="status"></section><section class="panel"><h2>📜 전투·모험 기록</h2><div class="log" id="log"></div><div style="display:flex;gap:5px;margin-top:8px"><input id="command" style="width:100%" placeholder="명령어: 탐색, 공격, 휴식, 상태"><button onclick="command()">입력</button></div></section></div><div><nav class="tabs" id="tabs"></nav><main id="main"></main></div></div><footer>독립 창작 게임 · 오프라인 플레이 가능 · 원작 이미지/데이터 미사용</footer></div><script>
// 저장소 접근이 차단된 미리보기/개인정보 보호 환경에서도 플레이는 계속됩니다.
const safeStorage = {
 getItem(k){try{return window.localStorage.getItem(k)}catch(e){return null}},
 setItem(k,v){try{window.localStorage.setItem(k,v);return true}catch(e){return false}},
 removeItem(k){try{window.localStorage.removeItem(k);return true}catch(e){return false}}
};
const gameErrors=[];
window.addEventListener('error',e=>{gameErrors.push(String(e.message||e.error));});
const JOBS={전사:{hp:145,mp:32,atk:15,def:8,skill:['강타','철벽','광전사의 일격'],desc:'높은 체력과 방어력'},도적:{hp:100,mp:55,atk:18,def:4,skill:['급소 찌르기','은신','암영난무'],desc:'높은 치명타와 회피'},마법사:{hp:75,mp:145,atk:11,def:2,skill:['화염구','빙결','메테오'],desc:'강력한 마법 피해'},성직자:{hp:100,mp:115,atk:10,def:5,skill:['신성한 빛','치유','심판'],desc:'회복과 안정적인 전투'},무도가:{hp:120,mp:65,atk:16,def:6,skill:['연속권','명상','용호격'],desc:'연타와 기력 운용'}};
const ZONES=[{name:'달그림자 마을',lv:1,mon:[],desc:'희미한 등불 아래 상인과 주민들이 모여 있는 마지막 안전지대.'},{name:'이끼 낀 숲',lv:1,mon:['숲 슬라임','굶주린 늑대','이끼 고블린'],desc:'고대 나무 사이로 기이한 울음소리가 들려옵니다.'},{name:'버려진 광산',lv:5,mon:['동굴 박쥐','광산 코볼트','돌 골렘'],desc:'버려진 갱도에서 쇠붙이와 돌이 부딪히는 소리가 울립니다.'},{name:'망자의 묘역',lv:10,mon:['해골 병사','망령','묘지 기사'],desc:'안개가 내려앉은 묘역에 잠들지 못한 영혼들이 떠돕니다.'},{name:'잿빛 요새',lv:16,mon:['흑갑 병사','저주받은 기사','요새 수호자'],desc:'멸망한 왕조의 깃발이 폐허 위에 펄럭입니다.'},{name:'얼어붙은 협곡',lv:23,mon:['서리 늑대','얼음 정령','빙하 거인'],desc:'매서운 눈보라가 길을 가립니다.'},{name:'심연의 신전',lv:31,mon:['심연 추종자','타락한 사제','심연의 파수꾼'],desc:'금지된 제단에 어둠이 응집됩니다.'},{name:'붉은 용의 둥지',lv:42,mon:['화염 비룡','용혈 전사','붉은 고룡'],desc:'용암이 흐르는 동굴 끝에서 거대한 심장이 뛰고 있습니다.'},{name:'영원의 균열',lv:55,mon:['차원 사냥꾼','공허의 마도사','균열의 군주'],desc:'현실과 악몽의 경계가 무너진 장소.'}];
const ITEMS=[{name:'낡은 단검',slot:'무기',atk:2,price:25},{name:'청동검',slot:'무기',atk:6,price:140},{name:'은빛 장검',slot:'무기',atk:13,price:850},{name:'룬 지팡이',slot:'무기',atk:19,price:2400},{name:'흑요석 검',slot:'무기',atk:31,price:8500},{name:'천 옷',slot:'갑옷',def:2,price:35},{name:'가죽 갑옷',slot:'갑옷',def:6,price:250},{name:'강철 갑옷',slot:'갑옷',def:12,price:1200},{name:'고룡의 비늘갑옷',slot:'갑옷',def:25,price:12000},{name:'낡은 반지',slot:'장신구',hp:15,price:170},{name:'마력의 반지',slot:'장신구',mp:45,price:950},{name:'수호의 인장',slot:'장신구',hp:95,price:6500}];
const QUESTS=[{name:'숲의 위협',zone:1,target:'숲 슬라임',count:5,gold:170,xp:110},{name:'늑대의 울음',zone:1,target:'굶주린 늑대',count:7,gold:350,xp:260},{name:'광산 탈환',zone:2,target:'광산 코볼트',count:8,gold:650,xp:560},{name:'잠들지 않는 망자',zone:3,target:'해골 병사',count:10,gold:1250,xp:1100},{name:'요새의 그림자',zone:4,target:'저주받은 기사',count:12,gold:2600,xp:2500},{name:'얼음의 시련',zone:5,target:'얼음 정령',count:12,gold:5500,xp:6000},{name:'심연 봉인',zone:6,target:'타락한 사제',count:15,gold:11000,xp:13000},{name:'용의 심장',zone:7,target:'붉은 고룡',count:3,gold:24000,xp:28000},{name:'최후의 균열',zone:8,target:'균열의 군주',count:3,gold:50000,xp:65000}];
let s=null,tab='모험',logs=[];const $=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,need=lv=>Math.floor(75*Math.pow(lv,1.65)),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('job').innerHTML=Object.entries(JOBS).map(([k,v])=>`<option value="${k}">${k} — ${v.desc}</option>`).join('');
function startGame(){let name=$('name').value.trim()||'이름 없는 모험가',job=$('job').value,j=JOBS[job];s={name,job,lv:1,xp:0,hp:j.hp,mp:j.mp,gold:100,stats:{str:5,dex:5,int:5,vit:5,wis:5},points:0,zone:0,enemy:null,bag:[{name:'작은 체력 물약',qty:5},{name:'작은 마력 물약',qty:3}],equip:{},kills:{},quests:{},turn:0,prestige:0};$('start').style.display='none';logs=[];try{say('왕국의 마지막 희망, '+name+'님이 모험을 시작했습니다.','good');render()}catch(e){$('start').style.display='flex';alert('게임 시작 중 오류: '+e.message);console.error(e)}}
function loadGame(){try{let v=JSON.parse(safeStorage.getItem('shadow_mud_save'));if(!v||!JOBS[v.job])throw Error();s=v;$('start').style.display='none';logs=[];say('저장된 모험을 불러왔습니다.','good');render()}catch(e){alert('불러올 저장 데이터가 없습니다.')}}
function saveGame(){if(s)safeStorage.setItem('shadow_mud_save',JSON.stringify(s))}function say(t,c=''){logs.push({t,c});if(logs.length>100)logs.shift();let l=$('log');l.innerHTML=logs.map(x=>`<div class="${x.c}">${esc(x.t)}</div>`).join('');l.scrollTop=l.scrollHeight}function maxhp(){return JOBS[s.job].hp+(s.lv-1)*11+s.stats.vit*5+(s.equip['장신구']?.hp||0)}function maxmp(){return JOBS[s.job].mp+(s.lv-1)*7+s.stats.wis*4+(s.equip['장신구']?.mp||0)}function atk(){return JOBS[s.job].atk+Math.floor(s.lv*2.2)+s.stats.str*2+(s.equip['무기']?.atk||0)}function def(){return JOBS[s.job].def+Math.floor(s.lv*.9)+s.stats.vit+(s.equip['갑옷']?.def||0)}function gainxp(n){s.xp+=n;while(s.xp>=need(s.lv)&&s.lv<99){s.xp-=need(s.lv);s.lv++;s.points+=5;s.hp=maxhp();s.mp=maxmp();say('★ 레벨 '+s.lv+' 달성! 능력치 포인트 5 획득.','good')}if(s.lv===99)s.xp=0}function heal(){if(s.enemy){say('전투 중에는 휴식할 수 없습니다.','bad');return}s.hp=maxhp();s.mp=maxmp();say('잠시 쉬며 체력과 마력을 모두 회복했습니다.','good');render()}
function travel(i){if(s.enemy){say('전투를 끝내야 이동할 수 있습니다.','bad');return}if(s.lv<ZONES[i].lv){say('이 지역은 레벨 '+ZONES[i].lv+'부터 진입할 수 있습니다.','bad');return}s.zone=i;s.hp=Math.min(s.hp,maxhp());say('→ '+ZONES[i].name+'에 도착했습니다.');render()}
function explore(){if(s.enemy){say('먼저 눈앞의 적을 처치하세요.','bad');return}if(!s.zone){say('마을 밖 지역으로 이동해야 탐색할 수 있습니다.');return}let z=ZONES[s.zone],ix=rnd(0,2),lv=z.lv+ix*2+rnd(0,2),boss=ix===2;let hp=Math.floor((42+lv*13)*(boss?1.8:1));s.enemy={name:z.mon[ix],lv,hp,max:hp,atk:Math.floor(6+lv*2.5),def:Math.floor(lv*.8),boss};say('⚔ '+z.mon[ix]+' (Lv.'+lv+') 등장!'+(boss?' [정예]':''),'bad');render()}
function enemyTurn(){if(!s.enemy)return;let e=s.enemy,d=Math.max(1,e.atk-def()+rnd(-4,5));if(Math.random()<Math.min(.27,s.stats.dex*.007)){say('적의 공격을 회피했습니다!','good');return}s.hp-=d;say(e.name+'의 공격! '+d+' 피해를 입었습니다.','bad');if(s.hp<=0){s.hp=Math.max(1,Math.floor(maxhp()*.35));s.mp=Math.floor(maxmp()*.3);s.gold=Math.floor(s.gold*.9);s.enemy=null;s.zone=0;say('☠ 쓰러졌습니다. 마을에서 부활합니다. 소지금의 10%를 잃었습니다.','bad')}}function attack(mult=1,magic=false,cost=0){if(!s.enemy){say('공격할 대상이 없습니다.');return}if(s.mp<cost){say('마력이 부족합니다.','bad');return}s.mp-=cost;let e=s.enemy,crit=Math.random()<Math.min(.55,.08+s.stats.dex*.008),base=magic?JOBS[s.job].atk+s.lv*3+s.stats.int*3:atk(),damage=Math.max(1,Math.floor((base*rnd(85,115)/100*mult-(magic?e.def*.35:e.def))*(crit?1.65:1)));e.hp-=damage;say((crit?'✦ 치명타! ':'')+e.name+'에게 '+damage+' 피해를 입혔습니다.',crit?'good':'');if(e.hp<=0){let xp=Math.floor((28+e.lv*12)*(e.boss?1.9:1)),gold=Math.floor((12+e.lv*8)*(e.boss?2.2:1));s.gold+=gold;s.kills[e.name]=(s.kills[e.name]||0)+1;gainxp(xp);say('승리! 경험치 '+xp+', 금화 '+gold+' 획득.','good');if(Math.random()<.28){let item=ITEMS[Math.min(ITEMS.length-1,Math.floor((s.zone-1)*1.5)+rnd(0,2))];add(item.name,1);say('전리품: '+item.name,'gold')}if(Math.random()<.4){add('작은 체력 물약',1);say('작은 체력 물약 획득.','good')}s.enemy=null}else enemyTurn();s.turn++;render()}
function skill(i){let job=s.job;if(i===1){let cost=10+Math.floor(s.lv/5);if(s.mp<cost){say('마력이 부족합니다.','bad');return}if(job==='성직자'){s.mp-=cost;s.hp=Math.min(maxhp(),s.hp+Math.floor(maxhp()*.45));say('치유로 체력을 회복했습니다.','good');if(s.enemy)enemyTurn();render();return}if(job==='무도가'){s.mp-=cost;s.hp=Math.min(maxhp(),s.hp+Math.floor(maxhp()*.18));say('명상으로 기력을 회복했습니다.','good');if(s.enemy)enemyTurn();render();return}if(job==='전사'){s.mp-=cost;s.hp=Math.min(maxhp(),s.hp+Math.floor(maxhp()*.15));say('철벽 자세로 버텨 체력을 회복했습니다.','good');if(s.enemy)enemyTurn();render();return}if(job==='도적'){s.mp-=cost;s.hp=Math.min(maxhp(),s.hp+Math.floor(maxhp()*.12));say('은신하여 호흡을 가다듬었습니다.','good');if(s.enemy)enemyTurn();render();return}attack(1.7,true,cost);return}attack(i===0?1.8:3.4,job==='마법사'||job==='성직자',i===0?9:27)}
function add(name,qty){let x=s.bag.find(x=>x.name===name);if(x)x.qty+=qty;else s.bag.push({name,qty})}function use(name){let x=s.bag.find(x=>x.name===name);if(!x||x.qty<1)return;if(name.includes('체력 물약')){s.hp=Math.min(maxhp(),s.hp+Math.floor(maxhp()*.45));say('체력 물약을 사용했습니다.','good')}else if(name.includes('마력 물약')){s.mp=Math.min(maxmp(),s.mp+Math.floor(maxmp()*.5));say('마력 물약을 사용했습니다.','good')}else{let item=ITEMS.find(y=>y.name===name);if(!item)return;let old=s.equip[item.slot];s.equip[item.slot]=item;if(old)add(old.name,1);say(item.name+' 장착!','good')}x.qty--;s.bag=s.bag.filter(x=>x.qty>0);s.hp=Math.min(s.hp,maxhp());s.mp=Math.min(s.mp,maxmp());if(s.enemy&&name.includes('물약'))enemyTurn();render()}function buy(name){if(s.zone!==0){say('상점은 마을에 있습니다.');return}let p=name.includes('물약')?name.includes('체력')?35:45:ITEMS.find(x=>x.name===name)?.price;if(s.gold<p){say('금화가 부족합니다.','bad');return}s.gold-=p;add(name,1);say(name+' 구매 완료.','good');render()}
function quest(i){let q=QUESTS[i];if(s.quests[i]==='done')return;if(!s.quests[i]){s.quests[i]={start:s.kills[q.target]||0};say('의뢰 수락: '+q.name,'good')}else{let n=(s.kills[q.target]||0)-s.quests[i].start;if(n<q.count){say('아직 '+(q.count-n)+'마리가 남았습니다.');return}s.gold+=q.gold;gainxp(q.xp);s.quests[i]='done';say('의뢰 완료! '+q.gold+' 금화, '+q.xp+' 경험치 획득.','good')}render()}
function stat(k){if(!s.points)return;s.stats[k]++;s.points--;s.hp=Math.min(maxhp(),s.hp+5);render()}
function render(){if(!s)return;let hp=Math.max(0,s.hp/maxhp()*100),mp=Math.max(0,s.mp/maxmp()*100),xp=s.lv===99?100:s.xp/need(s.lv)*100;$('status').innerHTML=`<h2>${esc(s.name)} <small>Lv.${s.lv} ${s.job}</small></h2><div class="flex"><span>❤️ HP ${s.hp}/${maxhp()}</span><span>🔮 MP ${s.mp}/${maxmp()}</span></div><div class="bar"><span style="width:${hp}%"></span></div><div class="bar mp"><span style="width:${mp}%"></span></div><small>경험치 ${s.xp}/${need(s.lv)}</small><div class="bar xp"><span style="width:${xp}%"></span></div><div>💰 ${s.gold.toLocaleString()} G　⚔ 공격 ${atk()}　🛡 방어 ${def()}</div><div class="muted">${ZONES[s.zone].name} · 처치 ${Object.values(s.kills).reduce((a,b)=>a+b,0)}마리</div>`;let tabs=['모험','지도','가방','캐릭터','의뢰','상점','도움말'];$('tabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let m='';if(tab==='모험'){let e=s.enemy;m=`<section class="panel"><h2>🌙 ${ZONES[s.zone].name}</h2><p>${ZONES[s.zone].desc}</p>${e?`<div class="monster"><b>☠ ${e.name}</b> <small>Lv.${e.lv}</small><div class="bar"><span style="width:${Math.max(0,e.hp/e.max*100)}%"></span></div>${Math.max(0,e.hp)} / ${e.max} HP</div>`:'<p class="muted">주변을 탐색해 적을 발견하거나 지도를 통해 이동하세요.</p>'}<div class="actions"><button onclick="explore()" ${!s.zone||e?'disabled':''}>🔎 주변 탐색</button><button onclick="attack()" ${!e?'disabled':''}>⚔ 기본 공격</button><button onclick="heal()" ${e?'disabled':''}>🏕 휴식</button>${JOBS[s.job].skill.map((x,i)=>`<button onclick="skill(${i})">✨ ${x}<small> (${i===0?9:i===1?10+Math.floor(s.lv/5):27} MP)</small></button>`).join('')}</div></section><section class="panel"><h2>📖 모험 안내</h2>지도로 사냥터를 선택하고 탐색하세요. 몬스터를 처치하면 경험치와 금화를 얻습니다. 마을에서 장비를 구매하고 의뢰를 완료할 수 있습니다.</section>`}else if(tab==='지도'){m=`<section class="panel"><h2>🗺 왕국 지도</h2><div class="map">${ZONES.map((z,i)=>`<button class="${s.zone===i?'here':''}" onclick="travel(${i})">${['🏘','🌲','⛏','🪦','🏰','❄','🕯','🐉','🌀'][i]}<div>${z.name}</div><small>Lv.${z.lv}+</small></button>`).join('')}</div><p class="muted">레벨 제한이 충족되면 자유롭게 이동할 수 있습니다.</p></section>`}else if(tab==='가방'){m=`<section class="panel"><h2>🎒 가방</h2>${s.bag.length?s.bag.map(x=>`<div class="item flex"><span>${esc(x.name)} ×${x.qty}</span><button onclick="use('${x.name}')">${x.name.includes('물약')?'사용':'장착'}</button></div>`).join(''):'가방이 비어 있습니다.'}<h2 style="margin-top:18px">착용 장비</h2>${['무기','갑옷','장신구'].map(k=>`<div class="item">${k}: ${s.equip[k]?.name||'없음'}</div>`).join('')}</section>`}else if(tab==='캐릭터'){m=`<section class="panel"><h2>🧙 능력치</h2><p>분배 가능 포인트: <b class="gold">${s.points}</b></p>${Object.entries({str:'힘 STR · 물리 공격',dex:'민첩 DEX · 치명타/회피',int:'지능 INT · 마법 공격',vit:'체력 VIT · 최대 HP/방어',wis:'지혜 WIS · 최대 MP'}).map(([k,v])=>`<div class="item flex"><span>${v} <b>${s.stats[k]}</b></span><button onclick="stat('${k}')" ${!s.points?'disabled':''}>+1</button></div>`).join('')}<p class="muted">레벨이 오를 때마다 능력치 포인트 5개를 획득합니다.</p><h2>직업 성장</h2><p>${s.job} → ${s.lv>=30?'상위 전직 자격 달성':'레벨 30에서 상위 전직 자격 개방'}</p><p class="muted">전직 직업별 전용 기술은 후속 확장 대상입니다.</p></section>`}else if(tab==='의뢰'){m=`<section class="panel"><h2>📜 현상금 의뢰</h2>${QUESTS.map((q,i)=>{let st=s.quests[i],n=st&&st!=='done'?Math.max(0,(s.kills[q.target]||0)-st.start):0;return `<div class="item"><b>${q.name}</b><div class="muted">${q.target} ${Math.min(n,q.count)}/${q.count} · 보상 ${q.gold}G / ${q.xp}XP</div><button onclick="quest(${i})" ${st==='done'?'disabled':''}>${st==='done'?'완료':!st?'수락':n>=q.count?'보상 받기':'진행 중'}</button></div>`}).join('')}</section>`}else if(tab==='상점'){m=`<section class="panel"><h2>🛒 마을 상점</h2><p class="muted">${s.zone===0?'구매할 물품을 선택하세요.':'마을에서만 구매할 수 있습니다.'}</p>${[{name:'작은 체력 물약',price:35},{name:'작은 마력 물약',price:45},...ITEMS].map(x=>`<div class="item flex"><span>${x.name}<small> ${x.atk?'공격+'+x.atk:x.def?'방어+'+x.def:x.hp?'HP+'+x.hp:x.mp?'MP+'+x.mp:''}</small><br><span class="gold">${x.price}G</span></span><button onclick="buy('${x.name}')" ${s.zone!==0||s.gold<x.price?'disabled':''}>구매</button></div>`).join('')}</section>`}else{m=`<section class="panel"><h2>⌨ MUD 명령어</h2><p>탐색 · 공격 · 휴식 · 상태 · 지도 · 가방 · 의뢰 · 상점 · 저장</p><p>전투 중에는 기술 버튼으로 마법과 특수 공격을 사용할 수 있습니다. 체력 물약을 사용하면 적이 한 번 행동합니다.</p><h2>저장 데이터</h2><p>현재 기기의 브라우저 저장소에 자동 저장됩니다. 브라우저 데이터를 삭제하면 기록이 사라질 수 있습니다.</p><button onclick="exportSave()">저장 데이터 내보내기</button> <button onclick="importSave()">저장 데이터 가져오기</button></section>`}$('main').innerHTML=m;saveGame()}
function command(){let v=$('command').value.trim();$('command').value='';if(v==='탐색')explore();else if(v==='공격')attack();else if(v==='휴식')heal();else if(['지도','가방','의뢰','상점','상태'].includes(v)){tab=v==='상태'?'캐릭터':v;render()}else if(v==='저장'){saveGame();say('게임을 저장했습니다.','good')}else say('알 수 없는 명령어입니다. 도움말을 확인하세요.')} $('command').addEventListener('keydown',e=>{if(e.key==='Enter')command()});function exportSave(){let b=new Blob([JSON.stringify(s)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='shadow-mud-save.json';a.click();URL.revokeObjectURL(a.href)}function importSave(){let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{let d=JSON.parse(await input.files[0].text());if(!JOBS[d.job]||!d.stats||!Array.isArray(d.bag))throw Error();s=d;s.enemy=null;render();say('저장 데이터를 가져왔습니다.','good')}catch(e){alert('올바른 저장 파일이 아닙니다.')}};input.click()}
</script><script>
/* Original single-player expansion, no external dependencies. */
const EXP_JOBS={전사:['기사','검성'],도적:['암살자','그림자군주'],마법사:['원소술사','대마도사'],성직자:['사제','성기사'],무도가:['권사','무신']};
const EXP_RECIPES=[{name:'철제 장검',material:'철광석',n:4,gold:150,slot:'무기',atk:17},{name:'수호자의 갑옷',material:'고대 파편',n:5,gold:550,slot:'갑옷',def:19},{name:'달빛 목걸이',material:'달빛 결정',n:4,gold:900,slot:'장신구',hp:70,mp:30},{name:'심연의 검',material:'심연석',n:8,gold:3500,slot:'무기',atk:48}];
const EXP_COMPANIONS=[{name:'잿빛 늑대',lv:5,gold:350,atk:6},{name:'숲의 요정',lv:15,gold:2200,atk:14,heal:8},{name:'그림자 기사',lv:30,gold:8500,atk:32},{name:'새벽의 용',lv:50,gold:28000,atk:65,heal:18}];
const EXP_STORY=[{title:'1장 · 꺼진 봉화',zone:1,target:'이끼 고블린',count:5,text:'달그림자 마을의 봉화가 꺼졌습니다. 숲에 잠입한 고블린을 처치하고 흔적을 조사하세요.',reward:300},{title:'2장 · 광산의 울림',zone:2,target:'돌 골렘',count:3,text:'봉화에 쓰이던 광석이 광산에서 사라졌습니다. 깊은 갱도의 수호자를 무찌르세요.',reward:1100},{title:'3장 · 망자의 서약',zone:3,target:'묘지 기사',count:4,text:'옛 왕의 서약이 깨지고 망자가 일어났습니다. 묘역의 봉인을 되살리세요.',reward:2600},{title:'4장 · 무너진 왕관',zone:4,target:'요새 수호자',count:5,text:'잿빛 요새에서 왕관의 파편을 찾아야 합니다.',reward:5500},{title:'5장 · 얼음의 예언',zone:5,target:'빙하 거인',count:5,text:'북쪽 협곡에 봉인된 예언을 깨우세요.',reward:9500},{title:'6장 · 금지된 제단',zone:6,target:'심연의 파수꾼',count:6,text:'심연의 제단을 봉인해 왕국의 마지막 성역을 지키세요.',reward:16000},{title:'7장 · 고룡의 심장',zone:7,target:'붉은 고룡',count:7,text:'고룡의 심장에 담긴 태초의 불을 회수하세요.',reward:30000},{title:'최종장 · 영원의 균열',zone:8,target:'균열의 군주',count:8,text:'균열의 군주를 물리치고 왕국의 밤을 끝내세요.',reward:75000}];
const EXP_DUNGEONS=[{name:'깊은 광산',zone:2,lv:8,floors:4},{name:'잊힌 지하묘지',zone:3,lv:15,floors:5},{name:'요새의 지하감옥',zone:4,lv:22,floors:6},{name:'빙결의 탑',zone:5,lv:30,floors:7},{name:'심연 회랑',zone:6,lv:40,floors:8},{name:'용의 성채',zone:7,lv:55,floors:9},{name:'영원의 미궁',zone:8,lv:70,floors:10}];
const EXP_ACHIEVEMENTS=[['첫 번째 승리',1,100],['사냥꾼',30,400],['정예 사냥꾼',100,1200],['백전노장',300,4000],['전설의 사냥꾼',1000,16000]];
function expInit(){if(!s)return;s.expansion??={stage:0,rank:0,materials:{},companion:null,enhance:{},story:0,storyBase:null,dungeon:null,achievements:[],codex:{},flags:{}};return s.expansion}
function expMaterial(name,n=1){let x=expInit();x.materials[name]=(x.materials[name]||0)+n}
function expNotify(t){say(t,'good');render()}
function expAdv(){let x=expInit(),req=x.rank===0?30:60;if(x.rank>=2)return say('이미 최종 승급에 도달했습니다.');if(s.lv<req)return say('승급에 필요한 레벨: '+req,'bad');if(s.enemy)return say('전투 중에는 승급할 수 없습니다.');x.rank++;s.points+=x.rank===1?15:25;s.hp=maxhp();s.mp=maxmp();expNotify('✦ '+EXP_JOBS[s.job][x.rank-1]+'(으)로 승급했습니다! 능력치 포인트를 획득했습니다.')}
function expCraft(i){let x=expInit(),r=EXP_RECIPES[i];if((x.materials[r.material]||0)<r.n||s.gold<r.gold)return say('재료 또는 금화가 부족합니다.','bad');x.materials[r.material]-=r.n;s.gold-=r.gold;add(r.name,1);expNotify('제작 완료: '+r.name)}
function expCompanion(i){let x=expInit(),c=EXP_COMPANIONS[i];if(s.lv<c.lv||s.gold<c.gold)return say('레벨 또는 금화가 부족합니다.','bad');if(x.companion?.name===c.name)return say('이미 함께 여행 중입니다.');s.gold-=c.gold;x.companion={...c};expNotify(c.name+'이(가) 동료가 되었습니다!')}
function expEnhance(){let x=expInit(),w=s.equip['무기'];if(!w)return say('무기를 장착하세요.','bad');let lv=x.enhance[w.name]||0;if(lv>=15)return say('강화 한도에 도달했습니다.');let cost=(lv+1)*180;if(s.gold<cost)return say('금화가 부족합니다.','bad');s.gold-=cost;let chance=Math.max(.25,.95-lv*.045);if(Math.random()<chance){x.enhance[w.name]=lv+1;w.atk=(w.atk||0)+3+Math.floor(lv/3);say('강화 성공! +'+(lv+1)+' '+w.name,'good')}else say('강화 실패. 장비는 파괴되지 않습니다.','bad');render()}
function expStory(){let x=expInit(),q=EXP_STORY[x.story];if(!q)return say('메인 스토리를 모두 완료했습니다.');if(x.storyBase===null){x.storyBase=s.kills[q.target]||0;say(q.title+' 임무를 시작했습니다.');render();return}let n=(s.kills[q.target]||0)-x.storyBase;if(n<q.count)return say('남은 목표: '+(q.count-n)+'마리');s.gold+=q.reward;gainxp(q.reward*2);x.story++;x.storyBase=null;expNotify('★ '+q.title+' 완료! '+q.reward+'G 및 경험치 획득.')}
function expDungeon(i){let x=expInit(),d=EXP_DUNGEONS[i];if(s.lv<d.lv)return say('입장 레벨이 부족합니다.','bad');if(s.enemy)return say('전투 중에는 입장할 수 없습니다.');x.dungeon={i,floor:1,wins:0};s.zone=d.zone;expNotify('던전 입장: '+d.name+' · 1층')}
function expDungeonExit(){let x=expInit();if(s.enemy)return say('전투 중에는 나갈 수 없습니다.');x.dungeon=null;s.zone=0;expNotify('던전에서 마을로 귀환했습니다.')}
function expAchievement(i){let x=expInit(),a=EXP_ACHIEVEMENTS[i],kills=Object.values(s.kills).reduce((a,b)=>a+b,0);if(x.achievements.includes(i))return;if(kills<a[1])return say('달성 조건을 충족하지 못했습니다.');x.achievements.push(i);s.gold+=a[2];expNotify('업적 보상 수령: '+a[0]+' '+a[2]+'G')}

const priorAttack=window.attack;window.attack=function(...args){const name=s?.enemy?.name, hp=s?.enemy?.hp;const before=wins();const result=priorAttack(...args);if(name&&hp>0&&!s?.enemy){if(wins()>before)journal('보스 승리',name);else if((s?.kills?.[name]||0)>0)journal('전투 종료',name);}return result;};
const priorTravel=window.travel;window.travel=function(...args){const before=s?.zone;const result=priorTravel(...args);if(s&&s.zone!==before)journal('지역 이동',ZONES[s.zone]?.name||String(s.zone));return result;};
const priorRender=window.render;window.render=function(){if(!s)return priorRender();const p=snapshot();if(s.achievements18){s.achievements18.bossWins=Math.max(numeric(s.achievements18.bossWins),wins());}priorRender();const tabs=$('tabs');if(!tabs)return;const btn=document.createElement('button');btn.textContent='📖 통합 일지';btn.className=tab==='통합 일지'?'active':'';btn.onclick=()=>{tab='통합 일지';render();};tabs.appendChild(btn);if(tab==='통합 일지')renderJournal();};
})();

</script><script>
/* v20: defensive save migration, deterministic validation, and event journal */
(()=>{'use strict';
const key='shadow_mud_save', oldRender=window.render, oldTravel=window.travel, oldAttack=window.attack;
const num=(v,min=0,max=1e12)=>Number.isFinite(v)?Math.max(min,Math.min(max,v)):min;
function normalize(d){if(!d||typeof d!=='object'||!JOBS[d.job]||typeof d.name!=='string')throw Error('직업 또는 이름이 올바르지 않습니다.');
 const out=structuredClone(d);out.name=out.name.slice(0,14);out.lv=Math.floor(num(out.lv,1,99));out.xp=Math.floor(num(out.xp));out.gold=Math.floor(num(out.gold));out.zone=Math.floor(num(out.zone,0,ZONES.length-1));out.points=Math.floor(num(out.points));out.stats??={};for(const k of ['str','dex','int','vit','wis'])out.stats[k]=Math.floor(num(out.stats[k],0,999));out.bag=Array.isArray(out.bag)?out.bag.filter(i=>i&&typeof i.name==='string'&&Number.isFinite(i.qty)&&i.qty>0).slice(0,500).map(i=>({name:i.name.slice(0,90),qty:Math.floor(num(i.qty,1,99999))})):[];out.equip=out.equip&&typeof out.equip==='object'?out.equip:{};out.kills=out.kills&&typeof out.kills==='object'?out.kills:{};out.quests=out.quests&&typeof out.quests==='object'?out.quests:{};out.hp=Math.floor(num(out.hp,1,1000000));out.mp=Math.floor(num(out.mp,0,1000000));out.v20??={events:[],migrations:0};if(!Array.isArray(out.v20.events))out.v20.events=[];out.v20.events=out.v20.events.slice(-100);return out;}
function event(kind,message){if(!s)return;s.v20??={events:[],migrations:0};s.v20.events??=[];s.v20.events.push({kind,message,time:new Date().toISOString()});s.v20.events=s.v20.events.slice(-100);}
function diagnostics(){let tests=[];const check=(name,fn)=>{try{if(!fn())throw Error('조건 불일치');tests.push({name,ok:true})}catch(e){tests.push({name,ok:false,why:e.message})}};
check('캐릭터 직업',()=>!!JOBS[s.job]);check('레벨 범위',()=>Number.isInteger(s.lv)&&s.lv>=1&&s.lv<=99);check('지역 범위',()=>Number.isInteger(s.zone)&&s.zone>=0&&s.zone<ZONES.length);check('인벤토리 구조',()=>Array.isArray(s.bag));check('능력치 구조',()=>['str','dex','int','vit','wis'].every(k=>Number.isFinite(s.stats?.[k])));check('핵심 함수',()=>['attack','explore','travel','saveGame','render','visualMove'].every(k=>typeof window[k]==='function'));check('저장 직렬화',()=>JSON.parse(JSON.stringify(s)).job===s.job);check('저장 데이터 정규화',()=>normalize(s).lv===s.lv);return tests;}
function page(){const tests=diagnostics(),good=tests.filter(x=>x.ok).length,events=s.v20?.events||[];document.getElementById('main').innerHTML=`<section class="panel"><h2>🛠 v20 안정화·진단</h2><p>진단 ${good}/${tests.length}개 통과</p>${tests.map(t=>`<div class="item">${t.ok?'✅':'❌'} ${t.name}${t.why?' — '+t.why:''}</div>`).join('')}<h2 style="margin-top:16px">최근 활동 기록</h2>${events.slice(-15).reverse().map(e=>`<div class="item">${esc(e.kind)} · ${esc(e.message)} <small>${esc(e.time)}</small></div>`).join('')||'<p class="muted">기록이 없습니다.</p>'}<div class="actions"><button onclick="v20Backup()">저장 백업</button><button onclick="v20Restore()">백업 복원</button><button onclick="v20Report()">진단 보고서</button></div><p class="muted">복원 전에 현재 저장을 백업하세요. 복원 시 현재 캐릭터 데이터가 교체됩니다.</p></section>`;}
function download(name,data){let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
window.v20Backup=()=>download('shadow-mud-v20-save.json',{format:'shadow-mud',version:20,savedAt:new Date().toISOString(),character:s});
window.v20Report=()=>download('shadow-mud-v20-diagnostics.json',{version:20,tests:diagnostics(),level:s.lv,job:s.job,zone:s.zone,events:s.v20?.events||[]});
window.v20Restore=()=>{let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const file=JSON.parse(await input.files[0].text());const candidate=normalize(file.format==='shadow-mud'?file.character:file);if(!confirm('현재 저장 데이터를 교체하시겠습니까?'))return;safeStorage.setItem(key,JSON.stringify(candidate));s=candidate;s.enemy=null;event('복원','백업 파일에서 캐릭터를 복원했습니다.');render();say('v20 저장 데이터를 복원했습니다.','good');}catch(e){alert('복원 실패: '+e.message)}};input.click()};
window.travel=function(...args){let before=s?.zone;let result=oldTravel(...args);if(s&&s.zone!==before)event('지역 이동',ZONES[s.zone]?.name||String(s.zone));return result};
window.attack=function(...args){let before=s?.enemy?.name,oldKills=before?(s.kills?.[before]||0):0;let result=oldAttack(...args);if(before&&(s?.kills?.[before]||0)>oldKills)event('처치',before);return result};
window.render=function(){if(!s)return oldRender();if(!s.v20){s.v20={events:[],migrations:1};}const result=oldRender();const tabs=document.getElementById('tabs');if(tabs){const b=document.createElement('button');b.textContent='🛠 안정화';b.className=tab==='안정화'?'active':'';b.onclick=()=>{tab='안정화';render()};tabs.appendChild(b);if(tab==='안정화')page();}return result;};
window.v20Normalize=normalize;
})();

</script><script>
/* v21: self-contained, turn-based boss trial. No interception of legacy combat. */
(()=>{'use strict';
const BOSSES=[
 {name:'그림자 기사',level:5,hp:115,atk:13,def:3,reward:240,xp:120,color:'#aa789f'},
 {name:'얼음 마녀',level:15,hp:270,atk:26,def:8,reward:900,xp:550,color:'#79b8df'},
 {name:'심연의 군주',level:30,hp:610,atk:48,def:15,reward:3200,xp:2400,color:'#b65b6e'}
];
const esc21=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function init(){if(!s)return null;if(!s.v21||typeof s.v21!=='object')s.v21={wins:{},losses:0,history:[],fight:null};s.v21.wins??={};s.v21.history??=[];return s.v21;}
function note(msg){const v=init();v.history.unshift(msg);v.history=v.history.slice(0,12);}
function start(i){const v=init();if(v.fight)return;if(!Number.isInteger(i)||i<0||i>=BOSSES.length)return;const b=BOSSES[i];if(s.lv<b.level){say('시련 입장에는 레벨 '+b.level+'이 필요합니다.','bad');return;}
 v.fight={id:i,hp:b.hp,max:b.hp,turn:0,guard:false,phase:1,log:['⚔ '+b.name+'과의 시련이 시작되었습니다.']};tab='보스 시련';render();}
function action(kind){const v=init(),f=v.fight;if(!f)return;const b=BOSSES[f.id];if(!b){v.fight=null;render();return;}
 if(s.hp<=0){s.hp=1;}let amount=0;
 if(kind==='attack'){amount=Math.max(1,Math.floor(atk()*.85)-b.def+Math.floor(Math.random()*9));f.log.push('검격! '+amount+' 피해');}
 else if(kind==='spell'){let cost=15;if(s.mp<cost){f.log.push('마력이 부족합니다.');render();return;}s.mp-=cost;amount=Math.max(1,Math.floor(atk()*1.45+s.stats.int*1.5)-Math.floor(b.def/2));f.log.push('마력 폭발! '+amount+' 피해 · MP -15');}
 else if(kind==='guard'){f.guard=true;f.log.push('방어 태세! 다음 공격 피해 감소');}
 else if(kind==='potion'){const item=s.bag.find(x=>x.name==='작은 체력 물약'&&x.qty>0);if(!item){f.log.push('체력 물약이 없습니다.');render();return;}item.qty--;if(item.qty===0)s.bag=s.bag.filter(x=>x!==item);const heal=Math.min(65,maxhp()-s.hp);s.hp+=heal;f.log.push('체력 물약 사용 · HP +'+heal);}
 else return;
 f.hp=Math.max(0,f.hp-amount);f.turn++;
 if(f.hp===0){s.gold+=b.reward;gainxp(b.xp);v.wins[b.name]=(v.wins[b.name]||0)+1;note('승리: '+b.name+' · '+b.reward+'G / '+b.xp+'XP');say('🏆 '+b.name+' 시련 승리! '+b.reward+'G, '+b.xp+'XP','good');v.fight=null;render();return;}
 const phase=f.hp<=b.hp*.4?2:1;if(phase!==f.phase){f.phase=phase;f.log.push('⚠ 보스가 격노했습니다! 공격력이 증가합니다.');}
 let dmg=Math.max(1,b.atk+(phase===2?Math.ceil(b.atk*.45):0)-Math.floor(def()*.5)+Math.floor(Math.random()*7));
 if(f.turn%4===0){dmg=Math.ceil(dmg*1.5);f.log.push('💥 보스의 강력한 일격!');}
 if(f.guard)dmg=Math.max(1,Math.floor(dmg*.35));f.guard=false;s.hp=Math.max(0,s.hp-dmg);f.log.push(b.name+'의 공격 · HP -'+dmg);
 if(s.hp===0){v.losses++;note('패배: '+b.name);say('시련에서 패배했습니다. 마을로 귀환합니다.','bad');v.fight=null;s.zone=0;s.hp=Math.max(1,Math.floor(maxhp()*.4));s.mp=Math.max(0,Math.floor(maxmp()*.4));}
 f.log=f.log.slice(-8);render();}
 function retreat(){const v=init();if(!v.fight)return;note('퇴각: '+BOSSES[v.fight.id]?.name);v.fight=null;render();}
 function page(){const v=init(),f=v.fight;let html='<section class="panel"><h2>⚔ 보스 시련 · v21</h2><p class="muted">독립 턴제 전투입니다. 실제 HP/MP와 물약이 소모되며, 승리 시 금화와 경험치를 받습니다.</p>';
 if(f){const b=BOSSES[f.id];html+=`<div class="v21-stage"><canvas id="v21canvas" width="320" height="170" aria-label="전투 장면"></canvas></div><h2>${esc21(b.name)} · ${f.phase===2?'2단계 격노':'1단계'}</h2><div class="bar"><span style="width:${100*f.hp/f.max}%"></span></div><p>보스 HP ${f.hp}/${f.max} · 내 HP ${s.hp}/${maxhp()} · MP ${s.mp}/${maxmp()}</p><div class="actions"><button onclick="v21Action('attack')">⚔ 기본 공격</button><button onclick="v21Action('spell')">✨ 마법 (15 MP)</button><button onclick="v21Action('guard')">🛡 방어</button><button onclick="v21Action('potion')">🧪 체력 물약</button><button onclick="v21Retreat()">🚪 퇴각</button></div><div class="log" style="height:170px;margin-top:10px">${f.log.slice().reverse().map(t=>'<div>'+esc21(t)+'</div>').join('')}</div>`;
 }else{html+='<div class="grid">'+BOSSES.map((b,i)=>`<div class="item"><b>${esc21(b.name)}</b><p class="muted">Lv.${b.level}+ · HP ${b.hp}<br>보상 ${b.reward}G / ${b.xp}XP<br>승리 ${v.wins[b.name]||0}회</p><button onclick="v21Start(${i})" ${s.lv<b.level?'disabled':''}>시련 도전</button></div>`).join('')+'</div>';}
 html+='<h2 style="margin-top:16px">📜 시련 기록</h2><p>총 패배 '+v.losses+'회</p>'+(v.history.length?v.history.map(x=>'<div class="item">'+esc21(x)+'</div>').join(''):'<p class="muted">기록이 없습니다.</p>')+'</section>';document.getElementById('main').innerHTML=html;if(f)draw(f);}
 function draw(f){const canvas=document.getElementById('v21canvas');if(!canvas)return;const c=canvas.getContext('2d'),b=BOSSES[f.id];c.fillStyle='#141322';c.fillRect(0,0,320,170);c.fillStyle='#25263c';c.fillRect(0,125,320,45);for(let i=0;i<12;i++){c.fillStyle=i%2?'#39344a':'#303047';c.fillRect(i*30,133,25,2)}
 const sprite=(x,y,color,enemy)=>{c.fillStyle='#10101a';c.fillRect(x+8,y+47,35,5);c.fillStyle=color;c.fillRect(x+13,y+13,25,28);c.fillStyle=enemy?'#ad9bba':'#d3b79d';c.fillRect(x+17,y+1,18,15);c.fillStyle='#1a1828';c.fillRect(x+20,y+7,4,3);c.fillRect(x+29,y+7,4,3);c.fillStyle=enemy?'#7e4259':'#8f744e';c.fillRect(x+10,y+38,13,16);c.fillRect(x+29,y+38,13,16);c.fillStyle='#c6b6d4';c.fillRect(x+(enemy?-4:39),y+22,6,29);};sprite(50,66,s.job==='마법사'?'#5966a5':'#708b7d',false);sprite(220,54,b.color,true);c.fillStyle='#e6d7b6';c.font='12px sans-serif';c.fillText(esc21(s.name).slice(0,10),38,55);c.fillText(b.name,208,43);if(f.phase===2){c.strokeStyle='#d95b67';c.lineWidth=3;c.strokeRect(211,49,61,69);}}
 window.v21Start=start;window.v21Action=action;window.v21Retreat=retreat;
 const oldRender=window.render;window.render=function(){const result=oldRender();if(!s)return result;init();const tabs=document.getElementById('tabs');if(tabs){const b=document.createElement('button');b.textContent='⚔ 보스 시련';b.className=tab==='보스 시련'?'active':'';b.onclick=()=>{tab='보스 시련';render()};tabs.appendChild(b);}if(tab==='보스 시련')page();return result;};
})();

</script></body></html>
